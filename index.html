<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048 - Édition Connectée</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f8efe0;--fg:#3e4a41;--board:#7e967e;--cell:#a6bda6;--btn:#d45b39;--btnfg:#f8efe0;--gap:2.6%;--sz:calc((100% - 3 * var(--gap)) / 4); box-sizing:border-box;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Clear Sans",Arial,sans-serif;display:flex;justify-content:center;align-items:flex-start}
main{width:min(94vw,480px);padding:16px 0;display:grid;grid-template-rows:auto auto 1fr;height:100%;gap:10px;}
.auth-panel { background:var(--cell); padding:10px; border-radius:6px; display:flex; flex-direction:column; gap:8px; font-size:0.9rem; }
.auth-panel input { padding:6px; border:1px solid var(--board); border-radius:4px; }
.auth-panel .row { display:flex; gap:8px; justify-content: space-between; align-items: center; }
.bar{display:flex;justify-content:space-between;align-items:center;width:100%}
.scores{display:flex;gap:8px}
.box{background:var(--board);color:#fff;border-radius:6px;padding:6px 14px;text-align:center;min-width:72px}
.box small{display:block;font-size:.65rem;text-transform:uppercase;opacity:.85}
.box b{font-size:1.25rem}
button{background:var(--btn);color:var(--btnfg);border:0;border-radius:6px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
#board{position:relative;width:100%;aspect-ratio:1;background:var(--board);border:10px solid var(--board);border-radius:8px;touch-action:none;user-select:none;margin-top:20px;}
.c,.t{position:absolute;width:var(--sz);height:var(--sz);border-radius:5px}
.c{background:var(--cell)}
.t{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9cqw;transition:left .12s ease,top .12s ease;color:var(--fg)}
.t.new{animation:ap .2s .1s backwards}.t.pop{animation:pop .18s}
@keyframes ap{from{transform:scale(0)}}
@keyframes pop{50%{transform:scale(1.18)}}
#ov{position:absolute;inset:0;background:rgba(248, 239, 224, 0.85);border-radius:8px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:2rem;font-weight:800;text-align:center;z-index:10}
#ov.on{display:flex}
.hidden { display: none !important; }
</style>
</head>
<body>
<main>
<div class="auth-panel" id="auth-box">
  <div id="login-ui">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">
    <div class="row">
      <button onclick="login()">Connexion</button>
      <button onclick="register()">Créer un compte</button>
    </div>
  </div>
  <div id="user-ui" class="hidden">
    <div class="row">
      <span id="user-email">Connecté</span>
      <button onclick="logout()">Déconnexion</button>
    </div>
    <div class="row">
      <label>Niveau (Départ) :</label>
      <select id="start-level">
        <option value="2">2</option>
        <option value="64">64</option>
        <option value="128">128</option>
        <option value="256">256</option>
      </select>
    </div>
  </div>
</div>

<div class="bar">
  <div class="scores">
    <div class="box"><small>Score</small><b id="s">0</b></div>
    <div class="box"><small>Record</small><b id="b">0</b></div>
  </div>
  <button id="nw">Nouvelle partie</button>
</div>

<div id="board">
  <div id="ov">
    <span id="msg"></span>
    <div><button id="kg">Continuer</button><button id="rs">Rejouer</button></div>
  </div>
</div>
</main>

<script>
// Initialisation Supabase
const supabaseUrl = 'https://otiwygdjmmfytqscfucp.supabase.co';
const supabaseKey = 'sb_publishable_eirX2CEAfi9hRw080MCUow_F67QeqiC';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

const N=4, board=document.getElementById('board'), ov=document.getElementById('ov');
const COL={2:'#fdf6e3',4:'#f6d77a',8:'#f29d4b',16:'#d9482b',32:'#f2b8c0',64:'#2f7d4f',128:'#8fd3d6',256:'#2f5d8c',512:'#9b6fb5',1024:'#6b2d5c',2048:'#222222'}, DARK=new Set([2,4,8,32,128]);
let tiles=[], nid=1, score=0, best=0, won=false, keep=false, over=false, els={};
let currentUser = null;

// Création grille visuelle
for(let i=0;i<16;i++){const c=document.createElement('div');c.className='c';place(c,i>>2,i&3);board.insertBefore(c,ov)}
function place(el,r,c){el.style.left=`calc(${c} * (var(--sz) + var(--gap)))`;el.style.top=`calc(${r} * (var(--sz) + var(--gap)))`}
function empty(){const o=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!tiles.some(t=>t.r==r&&t.c==c))o.push([r,c]);return o}

// Gestion Jeu
function spawn(forcedVal = null){
  const e=empty(); if(!e.length)return;
  const [r,c]=e[Math.random()*e.length|0];
  tiles.push({id:nid++, v: forcedVal || (Math.random()<.9?2:4), r, c, isNew:true});
}

function start(){
  tiles=[]; score=0; won=keep=over=false;
  Object.values(els).forEach(e=>e.remove()); els={};
  ov.classList.remove('on');
  
  const startVal = parseInt(document.getElementById('start-level').value) || 2;
  spawn(startVal); spawn(startVal === 2 ? null : 2); 
  render();
  saveToSupabase();
}

function render(){
  tiles.forEach(t=>{let e=els[t.id];
    if(!e){e=els[t.id]=document.createElement('div');board.insertBefore(e,ov)}
    e.className='t '+(t.isNew?' new':'');
    e.textContent=t.v; e.style.background=COL[t.v]||'#3e4a41'; e.style.color=t.v==2048?'#ffd54a':DARK.has(t.v)?'#3e4a41':'#fdf6e3';
    place(e,t.r,t.c);
    if(t.merged){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
    t.isNew=t.merged=false});
  document.getElementById('s').textContent=score;
  if(score>best){best=score; document.getElementById('b').textContent=best;}
}

function move(d){
  if(over||(won&&!keep)||ov.classList.contains('on'))return;
  let moved=false,dying=[];
  const pos=(i,k)=>d=='L'?[i,k]:d=='R'?[i,N-1-k]:d=='U'?[k,i]:[N-1-k,i];
  const key=t=>d=='L'?t.c:d=='R'?N-1-t.c:d=='U'?t.r:N-1-t.r;
  for(let i=0;i<N;i++){
    const line=tiles.filter(t=>(d=='L'||d=='R'?t.r:t.c)==i&&!t.dead).sort((a,b)=>key(a)-key(b));
    let k=0,prev=null;
    for(const t of line){
      if(prev&&!prev.merged&&prev.v==t.v){
        t.r=prev.r;t.c=prev.c;t.dead=true;dying.push(t);prev.v*=2;prev.merged=true;score+=prev.v;moved=true;
        if(prev.v==2048&&!won)won=true;
      }else{const [r,c]=pos(i,k++);if(r!=t.r||c!=t.c)moved=true;t.r=r;t.c=c;prev=t}
    }
  }
  if(!moved){tiles.forEach(t=>t.merged=false);return}
  spawn(); tiles=tiles.filter(t=>!t.dead);
  dying.forEach(t=>{const e=els[t.id];place(e,t.r,t.c);delete els[t.id];setTimeout(()=>e.remove(),130)});
  render(); saveToSupabase();
  if(won&&!keep)setTimeout(()=>{document.getElementById('msg').textContent='Bravo!';document.getElementById('kg').style.display='';ov.classList.add('on');},250);
  else if(!empty().length && !tiles.some(t=>tiles.some(u=>(Math.abs(u.r-t.r)+Math.abs(u.c-t.c)==1)&&u.v==t.v))){over=true;setTimeout(()=>{document.getElementById('msg').textContent='Terminé';document.getElementById('kg').style.display='none';ov.classList.add('on');},250)}
}

// Contrôles
document.addEventListener('keydown',e=>{
  const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[e.key];
  if(m){e.preventDefault();move(m)}
});
let sx,sy;
board.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
board.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))},{passive:true});
document.getElementById('nw').onclick=start;
document.getElementById('rs').onclick=start;
document.getElementById('kg').onclick=()=>{keep=true;ov.classList.remove('on')};

// --- AUTH & SUPABASE ---
async function register() {
  const { data, error } = await supabase.auth.signUp({ email: email.value, password: password.value });
  if (error) alert(error.message); else { alert("Compte créé !"); checkAuth(); }
}
async function login() {
  const { data, error } = await supabase.auth.signInWithPassword({ email: email.value, password: password.value });
  if (error) alert(error.message); else checkAuth();
}
async function logout() { await supabase.auth.signOut(); checkAuth(); }

async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  currentUser = session ? session.user : null;
  if (currentUser) {
    document.getElementById('login-ui').classList.add('hidden');
    document.getElementById('user-ui').classList.remove('hidden');
    document.getElementById('user-email').textContent = currentUser.email;
    loadFromSupabase();
  } else {
    document.getElementById('login-ui').classList.remove('hidden');
    document.getElementById('user-ui').classList.add('hidden');
    start(); 
  }
}

async function saveToSupabase() {
  if (!currentUser) return;
  await supabase.from('profiles').upsert({ id: currentUser.id, best_score: best, board_state: { tiles, score, nid } });
}

async function loadFromSupabase() {
  if (!currentUser) return;
  const { data } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
  if (data) {
    best = data.best_score || 0; document.getElementById('b').textContent = best;
    if (data.board_state && data.board_state.tiles.length > 0) {
      Object.values(els).forEach(e=>e.remove()); els={};
      tiles = data.board_state.tiles; score = data.board_state.score; nid = data.board_state.nid;
      render();
    } else start();
  } else start();
}

checkAuth();
</script>
</body>
</html>
