<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="2048">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f8efe0;--fg:#3e4a41;--board:#7e967e;--cell:#a6bda6;--btn:#d45b39;--btnfg:#f8efe0;--gap:2.6%;--sz:calc((100% - 3 * var(--gap)) / 4);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
/* Ajout de overflow:hidden pour bloquer le défilement */
html,body{margin:0;height:100%;overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/* Retrait de overflow-y:auto */
body{background:var(--bg);color:var(--fg);font-family:"Clear Sans","Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center;align-items:flex-start}
/* Changement de min-height:100vh en height:100% pour corriger le bug Safari IOS */
main{width:min(94vw,480px);padding:16px 0;display:grid;grid-template-rows:1fr auto 1fr;height:100%}
.top{align-self:end;padding-bottom:8px}
header{text-align:center;margin-bottom:30px}
h1{font-size:clamp(2.6rem,12vw,4rem);margin:0;font-weight:800;line-height:1}

/* Ligne des scores et du bouton nouvelle partie */
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-shrink:0;width:100%}
.scores{display:flex;gap:8px}
.box{background:var(--board);color:#fff;border-radius:6px;padding:6px 14px;text-align:center;min-width:72px}
.box small{display:block;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.box b{font-size:1.25rem}
button{background:var(--btn);color:var(--btnfg);border:0;border-radius:6px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}

/* Barre de progression avec Avatars */
.progress-wrapper{position:relative;width:calc(100% - 48px);margin:clamp(58px,10vh,84px) 24px 6px 24px;height:12px;background:var(--cell);border-radius:6px;flex-shrink:0}
.progress-fill{height:100%;width:0%;background:var(--btn);border-radius:6px;transition:width 0.4s ease}
.avatar{position:absolute;bottom:-3px;height:clamp(56px,10vh,84px);width:auto;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.goal{display:flex;justify-content:space-between;width:calc(100% - 48px);margin:0 24px;font-size:.8rem;font-weight:700;flex-shrink:0}
#papa{left:0%;transform:translateX(-50%);transition:left 0.4s ease;z-index:3}
#maman{right:0;transform:translateX(50%);z-index:2}

/* Grille de jeu */
#board{position:relative;width:100%;aspect-ratio:1;background:var(--board);border: 10px solid var(--board);border-radius:8px;container-type:inline-size;touch-action:none;user-select:none;margin:0}
.c,.t{position:absolute;width:var(--sz);height:var(--sz);border-radius:5px}
.c{background:var(--cell)}
.t{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9cqw;transition:left .12s ease,top .12s ease;color:var(--fg)}
.t.d3{font-size:7.5cqw}.t.d4{font-size:6cqw}
.t.new{animation:ap .2s .1s backwards}.t.pop{animation:pop .18s}
@keyframes ap{from{transform:scale(0)}}
@keyframes pop{50%{transform:scale(1.18)}}
#ov{position:absolute;inset:0;background:rgba(248, 239, 224, 0.85);color:var(--fg);border-radius:8px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:2rem;font-weight:800;text-align:center;z-index:10}
#ov.on{display:flex}
#ov div{display:flex;gap:8px}
</style>
</head>

function place(el,r,c){el.style.left=`calc(${c} * (var(--sz) + var(--gap)))`;el.style.top=`calc(${r} * (var(--sz) + var(--gap)))`}
function empty(){const o=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!tiles.some(t=>t.r==r&&t.c==c))o.push([r,c]);return o}
function spawn(){const e=empty();if(!e.length)return;const [r,c]=e[Math.random()*e.length|0];tiles.push({id:nid++,v:Math.random()<.9?2:4,r,c,isNew:true})}

function updateProgress() {
  const maxScore = 75584;
  // Calcul de la progression en pourcentage (limité à 100% max)
  const progress = Math.min((best / maxScore) * 100, 100);
  document.getElementById('progress-fill').style.width = progress + '%';
  document.getElementById('papa').style.left = progress + '%';
}

function start(){
  tiles=[];score=0;won=keep=over=false;
  Object.values(els).forEach(e=>e.remove());els={};
  ov.classList.remove('on');
  spawn();spawn();render();
}

function render(){
  tiles.forEach(t=>{let e=els[t.id];
    if(!e){e=els[t.id]=document.createElement('div');board.insertBefore(e,ov)}
    e.className='t d'+String(t.v).length+(t.isNew?' new':'');
    e.textContent=t.v;e.style.background=COL[t.v]||'#3e4a41';e.style.color=t.v==2048?'#ffd54a':DARK.has(t.v)?'#3e4a41':'#fdf6e3';
    place(e,t.r,t.c);
    if(t.merged){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
    t.isNew=t.merged=false});
  document.getElementById('s').textContent=score;
  if(score>best){best=score;try{localStorage.setItem('best2048',best)}catch(e){}}
  document.getElementById('b').textContent=best;
  
  // Met à jour la barre de progression à chaque rendu
  updateProgress();
}

function move(d){
  if(over||(won&&!keep)||ov.classList.contains('on'))return;
  let moved=false,dying=[];
  const pos=(i,k)=>d=='L'?[i,k]:d=='R'?[i,N-1-k]:d=='U'?[k,i]:[N-1-k,i];
  const key=t=>d=='L'?t.c:d=='R'?N-1-t.c:d=='U'?t.r:N-1-t.r;
  for(let i=0;i<N;i++){
    const line=tiles.filter(t=>(d=='L'||d=='R'?t.r:t.c)==i&&!t.dead).sort((a,b)=>key(a)-key(b));
    let k=0,prev=null;
    for(const t of line){
      if(prev&&!prev.merged&&prev.v==t.v){
        t.r=prev.r;t.c=prev.c;t.dead=true;dying.push(t);prev.v*=2;prev.merged=true;score+=prev.v;moved=true;
        if(prev.v==2048&&!won)won=true;
      }else{const [r,c]=pos(i,k++);if(r!=t.r||c!=t.c)moved=true;t.r=r;t.c=c;prev=t}
    }
  }
  if(!moved){tiles.forEach(t=>t.merged=false);return}
  spawn();
  tiles=tiles.filter(t=>!t.dead);
  dying.forEach(t=>{const e=els[t.id];place(e,t.r,t.c);delete els[t.id];setTimeout(()=>e.remove(),130)});
  render();
  if(won&&!keep)setTimeout(()=>show('Bravo, 2048 !',true),250);
  else if(!canMove()){over=true;setTimeout(()=>show('Partie terminée',false),250)}
}

function canMove(){
  if(empty().length)return true;
  return tiles.some(t=>tiles.some(u=>(Math.abs(u.r-t.r)+Math.abs(u.c-t.c)==1)&&u.v==t.v))}
function show(m,cont){document.getElementById('msg').textContent=m;document.getElementById('kg').style.display=cont?'':'none';ov.classList.add('on')}

document.addEventListener('keydown',e=>{
  const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D',a:'L',q:'L',d:'R',w:'U',z:'U',s:'D'}[e.key];
  if(m){e.preventDefault();move(m)}
});

let sx,sy;
board.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
board.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))},{passive:true});

document.getElementById('nw').onclick=start;
document.getElementById('rs').onclick=start;
document.getElementById('kg').onclick=()=>{keep=true;ov.classList.remove('on')};

start();
</script>
</body>
